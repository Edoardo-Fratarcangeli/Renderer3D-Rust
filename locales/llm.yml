  de: Modell / Graph / Datenbank importieren

"llm.import_hint":
  en: "Load a .gguf/.json model, a graph file or a database (.sql dump, SQLite) to visualize its network."
  it: "Carica un modello .gguf/.json, un file di grafo o un database (dump .sql, SQLite) per visualizzarne la rete."
