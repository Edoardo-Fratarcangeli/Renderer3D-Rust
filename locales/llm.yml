"llm.net_heading":
  en: "🧠 Neural Networks · Graphs · Databases"
  it: "🧠 Reti neurali · Grafi · Database"
  es: "🧠 Redes neuronales · Grafos · Bases de datos"
  fr: "🧠 Réseaux de neurones · Graphes · Bases de données"
