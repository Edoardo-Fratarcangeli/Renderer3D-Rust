  fr: "Chargez un modèle .gguf/.json, un graphe ou une base de données (dump .sql, SQLite) pour visualiser son réseau."
  de: "Lade ein .gguf/.json-Modell, eine Graphdatei oder eine Datenbank (.sql-Dump, SQLite), um ihr Netzwerk zu visualisieren."

