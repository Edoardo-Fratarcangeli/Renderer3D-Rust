"llm.net_hint":
  en: "Build an architecture, load a .gguf/.json model, import a graph file (GraphML, GEXF, DOT, GDF, TGF, Pajek, SIF, Cytoscape/node-link/JSON-LD) or a database (.sql dump, SQLite .db/.sqlite): tables become colored/shaped clusters linked by their relations — visualized in 3D."
  it: "Costruisci un'architettura, carica un modello .gguf/.json, importa un file di grafo (GraphML, GEXF, DOT, GDF, TGF, Pajek, SIF, Cytoscape/node-link/JSON-LD) o un database (dump .sql, SQLite .db/.sqlite): le tabelle diventano cluster con colori/forme propri collegati dalle relazioni — visualizzato in 3D."
  es: "Crea una arquitectura, carga un modelo .gguf/.json, importa un grafo (GraphML, GEXF, DOT, GDF, TGF, Pajek, SIF, Cytoscape/node-link/JSON-LD) o una base de datos (volcado .sql, SQLite .db/.sqlite): las tablas se vuelven clústeres con colores/formas propios unidos por sus relaciones — visualizado en 3D."
  fr: "Construisez une architecture, chargez un modèle .gguf/.json, importez un graphe (GraphML, GEXF, DOT, GDF, TGF, Pajek, SIF, Cytoscape/node-link/JSON-LD) ou une base de données (dump .sql, SQLite .db/.sqlite) : les tables deviennent des clusters aux couleurs/formes propres reliés par leurs relations — visualisé en 3D."
  de: "Erstelle eine Architektur, lade ein .gguf/.json-Modell, importiere eine Graphdatei (GraphML, GEXF, DOT, GDF, TGF, Pajek, SIF, Cytoscape/node-link/JSON-LD) oder eine Datenbank (.sql-Dump, SQLite .db/.sqlite): Tabellen werden zu Clustern mit eigenen Farben/Formen, verbunden durch ihre Relationen — in 3D dargestellt."

